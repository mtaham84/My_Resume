  <h2 class="h2txt">Contact Me</h2>

  <form class="contact-form">
    <div class="form-group">
      <label>Name</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" required>
    </div>

    <div class="form-group">
      <label>Message</label>
      <textarea rows="5" required></textarea>
    </div>

    <button type="submit">Send</button>
  </form>
